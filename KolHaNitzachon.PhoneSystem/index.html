<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kol HaNitzachon - Recipient Maintenance</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Kol HaNitzachon Phone System</h1>
            <span>Recipient Maintenance</span>
        </div>
    </header>

    <main class="container">

        <section class="card">

            <h2>Add / Edit Recipient</h2>

            <form id="recipientForm">

                <input type="hidden" id="recipientId">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Code *</label>
                        <input type="number" id="code" required>
                    </div>

                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Recording</label>
                        <input type="file" id="recording">
                    </div>

                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="startDate">
                    </div>

                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="endDate">
                    </div>

                </div>

                <div class="buttons">

                    <button type="submit" class="primary">
                        Save Recipient
                    </button>

                    <button type="button"
                            class="secondary"
                            id="cancelEdit">
                        Cancel
                    </button>

                </div>

            </form>

        </section>

        <section class="card">

            <h2>Recipients</h2>

            <table>

                <thead>

                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Recording</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="recipientTable"></tbody>

            </table>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
